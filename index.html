<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#0b6bcb">
  <title>Lên Kệ Kho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f5;
      --surface: #ffffff;
      --surface-2: #f3f5f8;
      --line: #d5dbe3;
      --line-strong: #b4bdc9;
      --text: #0f172a;
      --text-2: #485466;
      --text-3: #7a8494;
      --ok: #15803d;
      --ok-bg: #e5f5ea;
      --warn: #9a5a06;
      --warn-bg: #fff6e3;
      --warn-line: #f0b44a;
      --err: #c0262d;
      --err-bg: #fdeceb;
      --accent: #0b6bcb;
      --accent-ink: #ffffff;
      --accent-soft: #e3eefb;
      --accent-dark: #0a57a6;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 3px 10px rgba(15, 23, 42, 0.05);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Tầng 2 đổi toàn bộ màu nhấn để luôn biết mình đang ở tầng nào */
    body[data-floor="2"] {
      --accent: #7c3aed;
      --accent-soft: #f0e8fe;
      --accent-dark: #6326cc;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    input { font-family: inherit; }

    .app { max-width: 520px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }

    /* HEADER: cả dải màu theo tầng */
    .hdr {
      position: sticky; top: 0; z-index: 20; margin: 0 -16px;
      display: flex; align-items: center; gap: 12px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: var(--accent); color: #ffffff;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.18);
      transition: background 0.2s;
    }
    .floor-chip {
      border: none; border-radius: 12px; background: #ffffff; color: var(--accent-dark);
      padding: 7px 12px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1;
      min-width: 70px;
    }
    .floor-chip .n { font-size: 17px; font-weight: 800; }
    .floor-chip .p { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text-2); }
    .hdr-mid { flex: 1; min-width: 0; }
    .hdr-op { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sync {
      display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 2px 0;
      font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
    }
    .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); }
    .sync[data-s="ok"] .dot { background: #4ade80; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5); }
    .sync[data-s="loading"] .dot { background: #fde047; animation: blink 1s infinite; }
    .sync[data-s="err"] { background: var(--err); color: #ffffff; padding: 3px 10px; border-radius: 999px; }
    .sync[data-s="err"] .dot { background: #ffffff; }
    @keyframes blink { 50% { opacity: 0.25; } }
    .icon-btn {
      width: 50px; height: 50px; border-radius: 14px; border: none; background: rgba(255, 255, 255, 0.2); color: #ffffff;
      font-size: 22px; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { background: rgba(255, 255, 255, 0.32); }

    /* TIẾN ĐỘ */
    .progress { height: 8px; margin-top: 12px; border-radius: 8px; background: #dce2ea; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--accent); border-radius: 8px; transition: width 0.4s; }
    .progress-label { display: flex; justify-content: space-between; margin: 7px 0 14px; font-size: 13px; font-weight: 600; color: var(--text-2); }
    .progress-label b { color: var(--text); }

    .eyebrow { display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); margin: 0 0 10px; }

    /* BƯỚC 1: QUÉT THÙNG */
    .scan-field { position: relative; }
    .scan-input {
      width: 100%; height: 68px; padding: 0 60px 0 18px; border-radius: 18px;
      border: 2px solid var(--line-strong); background: var(--surface); color: var(--text);
      font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; outline: none;
      box-shadow: var(--shadow);
    }
    .scan-input::placeholder { color: var(--text-3); font-family: var(--sans); font-size: 17px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .scan-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .clear-btn {
      position: absolute; right: 10px; top: 10px; width: 48px; height: 48px; border-radius: 12px;
      border: none; background: var(--surface-2); color: var(--text-2); font-size: 24px; font-weight: 600;
    }
    .hint { margin-top: 12px; padding: 13px 15px; border-radius: 14px; font-size: 15px; font-weight: 600; line-height: 1.45; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); }
    .hint.err { background: var(--err-bg); border-color: #f3c0bd; color: var(--err); }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .results { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .row {
      width: 100%; min-height: 76px; text-align: left; display: flex; align-items: center; gap: 12px;
      padding: 14px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
    }
    .row:active { background: var(--accent-soft); border-color: var(--accent); }
    .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .row-id { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); word-break: break-all; }
    .row-id mark { background: var(--accent-soft); color: var(--accent-dark); border-radius: 4px; padding: 0 2px; }
    .row-meta { font-size: 14px; color: var(--text-2); }
    .more { text-align: center; font-size: 14px; color: var(--text-3); padding: 6px; }

    .pill { flex-shrink: 0; padding: 7px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .pill-empty { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
    .pill-done { background: var(--ok-bg); color: var(--ok); font-family: var(--mono); }

    .recent { margin-top: 26px; }
    .recent-list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .recent-row {
      width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border: none; border-bottom: 1px solid var(--line); background: none; text-align: left;
    }
    .recent-row:last-child { border-bottom: none; }
    .recent-row:active { background: var(--surface-2); }
    .recent-row .id { font-family: var(--mono); font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .recent-row .bin { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--ok); }
    .recent-row .t { font-size: 13px; color: var(--text-3); width: 44px; text-align: right; }

    /* BƯỚC 2: THÙNG + KỆ */
    .back {
      border: none; background: none; padding: 6px 0; margin-bottom: 2px; min-height: 44px;
      font-size: 16px; font-weight: 700; color: var(--accent-dark);
    }
    .box-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 6px; box-shadow: var(--shadow); }
    .box-id { font-family: var(--mono); font-size: 25px; font-weight: 800; letter-spacing: 0.02em; word-break: break-all; }
    .box-meta { margin-top: 6px; font-size: 15px; color: var(--text-2); }
    .box-meta b { color: var(--text); font-weight: 800; }

    .state { margin-top: 14px; border-radius: 14px; padding: 12px 14px; }
    .state-label { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .state-empty { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
    .state-done { background: var(--warn-bg); border: 1.5px solid var(--warn-line); }
    .state-done .state-label { color: var(--warn); }
    .state-bin { font-family: var(--mono); font-size: 32px; font-weight: 800; margin: 4px 0 2px; color: var(--text); }
    .state-meta { font-size: 14px; color: var(--text-2); line-height: 1.45; }
    .state-note { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--warn); }

    .skus { margin-top: 4px; }
    .skus summary { list-style: none; padding: 8px 0; font-size: 15px; font-weight: 700; color: var(--accent-dark); }
    .skus summary::-webkit-details-marker { display: none; }
    .skus summary::after { content: " ▾"; }
    .skus[open] summary::after { content: " ▴"; }
    .sku-list { max-height: 180px; overflow-y: auto; border-top: 1px solid var(--line); }
    .sku { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .sku:last-child { border-bottom: none; }
    .sku span { font-family: var(--mono); font-weight: 600; }
    .sku b { font-weight: 800; }

    .ghost-btn {
      width: 100%; height: 58px; margin-top: 14px; border-radius: 16px;
      border: 2px dashed var(--line-strong); background: var(--surface); font-size: 17px; font-weight: 700; color: var(--text-2);
    }
    .ghost-btn:active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }

    .bin-panel { margin-top: 14px; }
    .slots { display: flex; align-items: stretch; gap: 6px; }
    .slot-pre {
      display: flex; align-items: center; padding: 0 12px; border-radius: 14px;
      background: var(--accent); color: var(--accent-ink); font-family: var(--mono); font-size: 22px; font-weight: 800;
    }
    .slot {
      flex: 1; min-width: 0; height: 58px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 30px; font-weight: 800; color: var(--text);
    }
    .slot.gap { margin-left: 8px; }
    .slot.filled { border-color: var(--text-3); }
    .slot.current { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .slot.current::after { content: ""; width: 2px; height: 30px; background: var(--accent); animation: blink 1s infinite; }
    .slot-help { margin-top: 8px; font-size: 14px; color: var(--text-2); }

    /* Phím nổi như phím thật, bấm xuống thì lún */
    .keypad { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key {
      height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
      box-shadow: 0 3px 0 #cfd6df; color: var(--text);
      font-family: var(--mono); font-size: 27px; font-weight: 700;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .key:active { transform: translateY(3px); box-shadow: 0 0 0 #cfd6df; background: var(--accent-soft); }
    .key.fn { font-family: var(--sans); font-size: 16px; font-weight: 700; color: var(--text-2); background: var(--surface-2); }

    .cta {
      width: 100%; height: 64px; margin-top: 12px; border: none; border-radius: 18px;
      background: var(--accent); color: var(--accent-ink); font-size: 19px; font-weight: 800; letter-spacing: 0.01em;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
    }
    .cta:active { filter: brightness(0.92); }
    .cta:disabled { background: #dfe4eb; color: var(--text-3); box-shadow: none; }
    .cta.busy { opacity: 0.7; }
    /* Màn hình cao thì phím to hơn */
    @media (min-height: 760px) {
      .slot { height: 66px; }
      .key { height: 60px; }
    }
    /* Nút lưu luôn nằm trong tầm tay, kể cả điện thoại màn ngắn */
    .bin-panel .cta { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); }

    /* LỚP PHỦ: HỘP THOẠI, MENU, THIẾT LẬP, THÀNH CÔNG */
    .overlay {
      position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .dlg {
      width: 100%; max-width: 360px; background: var(--surface);
      border-radius: 22px; padding: 22px 18px 18px; text-align: center; animation: pop 0.18s ease-out;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
    }
    @keyframes pop { from { transform: scale(0.94); opacity: 0; } }
    .dlg-icon { font-size: 36px; }
    .dlg h2 { margin: 8px 0 6px; font-size: 20px; font-weight: 800; }
    .dlg-body { font-size: 16px; line-height: 1.5; color: var(--text-2); }
    .dlg-input {
      width: 100%; height: 56px; margin-top: 14px; border-radius: 14px; border: 2px solid var(--line-strong);
      background: var(--surface-2); color: var(--text); text-align: center; font-size: 22px; font-weight: 700; outline: none;
    }
    .dlg-input:focus { border-color: var(--accent); background: var(--surface); }
    .dlg-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; height: 54px; border-radius: 14px; border: none; font-size: 17px; font-weight: 800; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-danger { background: #b45309; color: #ffffff; }
    .btn-ghost { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }

    .sheet-wrap { align-items: flex-end; padding: 0; }
    .sheet {
      width: 100%; max-width: 520px; background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); animation: up 0.2s ease-out;
      box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.2);
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .grabber { width: 44px; height: 5px; border-radius: 5px; background: var(--line-strong); margin: 0 auto 12px; }
    .sheet-title { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: 14px 4px 6px; }
    .menu-item {
      width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 12px 6px;
      border: none; background: none; text-align: left; border-radius: 12px;
    }
    .menu-item:active { background: var(--surface-2); }
    .menu-item .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 19px; }
    .menu-item .tx { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .menu-item .tx b { font-size: 17px; font-weight: 700; }
    .menu-item .tx small { font-size: 14px; color: var(--text-2); }

    .setup {
      position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto;
      padding: calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    }
    .setup-in { max-width: 440px; margin: 0 auto; }
    .brand { font-size: 13px; font-weight: 800; letter-spacing: 0.16em; color: var(--accent-dark); }
    .setup h1 { margin: 8px 0 28px; font-size: 30px; line-height: 1.2; font-weight: 800; }
    .setup .eyebrow { margin-top: 22px; }
    .setup-name {
      width: 100%; height: 64px; padding: 0 18px; border-radius: 16px; border: 2px solid var(--line-strong);
      background: var(--surface); color: var(--text); font-size: 21px; font-weight: 700; text-transform: uppercase; outline: none;
      box-shadow: var(--shadow);
    }
    .setup-name:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .floor-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .floor-card {
      height: 116px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px;
      color: var(--text);
    }
    .floor-card .fn { font-size: 23px; font-weight: 800; }
    .floor-card .fp { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text-2); }
    .floor-card[data-f="1"].on { border-color: #0b6bcb; background: #0b6bcb; color: #ffffff; }
    .floor-card[data-f="2"].on { border-color: #7c3aed; background: #7c3aed; color: #ffffff; }
    .floor-card.on .fp { color: rgba(255, 255, 255, 0.85); }
    .setup .cta { margin-top: 30px; }
    .setup-cancel { width: 100%; margin-top: 10px; height: 52px; border: none; background: none; color: var(--text-2); font-size: 16px; font-weight: 700; }

    /* Màn xanh chỉ để báo, không chặn thao tác: chạm/quét tiếp được ngay */
    .flash {
      position: fixed; inset: 0; z-index: 60; background: var(--ok); color: #ffffff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      animation: flashIn 0.12s ease-out; text-align: center; padding: 20px; pointer-events: none;
    }

    /* Trạng thái lưu lên Sheet trong danh sách vừa lưu */
    .recent-row .st { width: 24px; text-align: center; font-size: 15px; font-weight: 800; }
    .st-pending { color: var(--warn); }
    .st-saved { color: var(--ok); }
    .st-conflict, .st-failed { color: var(--err); }
    .recent-row.bad .bin { color: var(--err); text-decoration: line-through; }

    /* Kết quả sẽ được chọn khi bấm Enter */
    .row-best { border: 2px solid var(--accent); }
    .enter-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-dark); font-size: 12px; font-weight: 800; }
    @keyframes flashIn { from { opacity: 0; } }
    .flash-check { width: 96px; height: 96px; border-radius: 50%; background: #ffffff; color: var(--ok); display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; margin-bottom: 14px; }
    .flash-box { font-family: var(--mono); font-size: 20px; font-weight: 700; word-break: break-all; opacity: 0.9; }
    .flash-arrow { font-size: 22px; font-weight: 800; opacity: 0.7; }
    .flash-bin { font-family: var(--mono); font-size: 42px; font-weight: 800; }
  </style>
</head>
<body data-floor="1">

  <div class="app">
    <header class="hdr">
      <button class="floor-chip" onclick="openSetup()" aria-label="Đổi tầng">
        <span class="n" id="floorNum">—</span>
        <span class="p" id="floorPre">S10</span>
      </button>
      <div class="hdr-mid">
        <div class="hdr-op" id="hdrOp">Chưa nhập tên</div>
        <button class="sync" id="sync" data-s="loading" onclick="syncTap()">
          <span class="dot"></span><span id="syncText">Đang tải dữ liệu…</span>
        </button>
      </div>
      <button class="icon-btn" onclick="openMenu()" aria-label="Menu">☰</button>
    </header>

    <div class="progress"><div class="progress-bar" id="progBar"></div></div>
    <div class="progress-label"><span id="progText">—</span><span id="progPct"></span></div>

    <!-- BƯỚC 1: QUÉT / NHẬP MÃ THÙNG -->
    <section id="viewScan">
      <label class="eyebrow" for="boxInput">Bước 1 · Mã thùng</label>
      <div class="scan-field">
        <input id="boxInput" class="scan-input" type="text" placeholder="Quét hoặc gõ vài ký tự cuối…"
               autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="clear-btn" id="clearBtn" onclick="backToScan()" aria-label="Xoá" hidden>×</button>
      </div>
      <div class="hint" id="scanHint" hidden></div>
      <div class="results" id="results"></div>
      <div class="recent" id="recentWrap" hidden>
        <span class="eyebrow">Vừa lưu</span>
        <div class="recent-list" id="recentList"></div>
      </div>
    </section>

    <!-- BƯỚC 2: THÔNG TIN THÙNG + NHẬP KỆ -->
    <section id="viewBox" hidden>
      <button class="back" onclick="backToScan()">‹ Chọn thùng khác</button>
      <div class="box-card">
        <div class="box-id" id="bxId"></div>
        <div class="box-meta"><span id="bxInbound"></span> · <b id="bxQty"></b></div>
        <div class="state" id="bxState"></div>
        <details class="skus" id="skuDetails">
          <summary>Xem <span id="bxSkuCount"></span> mã hàng trong thùng</summary>
          <div class="sku-list" id="bxSkus"></div>
        </details>
      </div>

      <button class="ghost-btn" id="btnMove" onclick="startMove()" hidden>Chuyển sang kệ khác</button>

      <div class="bin-panel" id="binPanel">
        <span class="eyebrow" id="binLabel">Bước 2 · Vị trí kệ</span>
        <div class="slots" id="slots"></div>
        <div class="slot-help">Nhập 6 số trên nhãn kệ, hoặc quét mã kệ</div>
        <div class="keypad" id="keypad"></div>
        <button class="cta" id="btnSave" onclick="save(false)" disabled>Nhập đủ 6 số</button>
      </div>
    </section>
  </div>

  <!-- THIẾT LẬP: TÊN + TẦNG -->
  <div class="setup" id="setup" hidden>
    <div class="setup-in">
      <div class="brand">KHO · LÊN KỆ</div>
      <h1>Bắt đầu ca làm việc</h1>
      <label class="eyebrow" for="setupName">Tên hoặc mã nhân viên</label>
      <input id="setupName" class="setup-name" type="text" placeholder="VD: SƠN, NV01" autocomplete="off" autocorrect="off" spellcheck="false">
      <span class="eyebrow">Khu vực làm việc</span>
      <div class="floor-cards">
        <button class="floor-card" data-f="1" onclick="pickFloor(1)"><span class="fn">Tầng 1</span><span class="fp">S10······</span></button>
        <button class="floor-card" data-f="2" onclick="pickFloor(2)"><span class="fn">Tầng 2</span><span class="fp">S15······</span></button>
      </div>
      <button class="cta" id="setupGo" onclick="saveSetup()" disabled>Bắt đầu</button>
      <button class="setup-cancel" id="setupCancel" onclick="closeSetup()" hidden>Huỷ</button>
    </div>
  </div>

  <!-- MENU -->
  <div class="overlay sheet-wrap" id="menu" hidden onclick="if (event.target === this) closeMenu()">
    <div class="sheet">
      <div class="grabber"></div>
      <div id="menuBody"></div>
    </div>
  </div>

  <!-- HỘP THOẠI -->
  <div class="overlay" id="dlg" hidden>
    <div class="dlg">
      <div class="dlg-icon" id="dlgIcon"></div>
      <h2 id="dlgTitle"></h2>
      <div class="dlg-body" id="dlgBody"></div>
      <input class="dlg-input" id="dlgInput" hidden>
      <div class="dlg-actions" id="dlgActions"></div>
    </div>
  </div>

  <!-- LƯU THÀNH CÔNG -->
  <div class="flash" id="flash" hidden>
    <div class="flash-check">✓</div>
    <div class="flash-box" id="flashBox"></div>
    <div class="flash-arrow">↓</div>
    <div class="flash-bin" id="flashBin"></div>
  </div>

  <input type="file" id="fileInput" accept=".xlsx, .xls" hidden onchange="handleExcelUpload(event)">

  <script>
    // Dán URL Web App của Apps Script (kết thúc bằng /exec) vào đây
    const API_URL = "https://script.google.com/macros/s/AKfycbxuwQMfw-qKAwutV8hOkDbmUa1zbR3XGbYfS9e-GjAJ9hvkp5Yrg2eWg4ubjQEM2lxh/exec";
    const EXCELJS_URL = "https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js";

    // Gửi request tới Apps Script. Dùng text/plain để tránh lỗi CORS preflight.
    async function callApi(action, data = {}) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action: action }, data))
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const vibrate = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };
    const clock = (t) => { const d = t ? new Date(t) : new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

    let operator = store.get("WAREHOUSE_OPERATOR") || "";
    let floor = parseInt(store.get("WAREHOUSE_FLOOR"), 10) || null;
    let BOX_MAP = {};
    let BOX_LIST = [];
    let selectedId = "";
    let digits = "";
    let scanPrefix = "";   // đang nhận mã kệ quét bằng súng, dạng S15xxxxxx
    let adminPin = "";
    let lastLoadAt = 0;
    let loading = false;
    let lastSyncText = "";
    const recent = [];

    const prefix = () => (floor === 1 ? "S10" : "S15");

    document.addEventListener("DOMContentLoaded", function() {
      buildKeypad();
      applyFloor();
      renderOperator();
      $("boxInput").addEventListener("input", () => search(false));
      $("boxInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(true); } });
      $("setupName").addEventListener("input", renderSetup);
      $("setupName").addEventListener("keydown", (e) => { if (e.key === "Enter") saveSetup(); });
      document.addEventListener("keydown", onGlobalKey);
      // Quay lại app sau một lúc thì tự lấy dữ liệu mới (người khác có thể đã lên kệ)
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && Date.now() - lastLoadAt > 120000) loadData(true);
      });

      // Có mạng lại thì gửi ngay hàng chờ
      window.addEventListener("online", flushNow);
      window.addEventListener("beforeunload", (e) => { if (outbox.length) { e.preventDefault(); e.returnValue = ""; } });

      // Hàng chờ còn sót từ lần mở trước: hiện lại trong "Vừa lưu" và gửi tiếp
      outbox.slice().reverse().forEach((o) => recent.push({ boxId: o.boxId, bin: o.bin, time: clock(o.at), status: "pending" }));

      if (!operator || !floor) openSetup();
      else $("boxInput").focus();
      renderRecent();
      loadData();
      flush();
    });

    // ---------- DỮ LIỆU ----------
    function loadData(silent) {
      if (loading) return;
      loading = true;
      setSync("loading", silent ? "Đang cập nhật…" : "Đang tải dữ liệu…");
      callApi("load")
        .then((res) => {
          if (!res.success) throw new Error(res.message || "Lỗi tải dữ liệu");
          buildCache(res.items);
          applyOutbox();
          lastLoadAt = Date.now();
          lastSyncText = `${res.items.length} dòng · cập nhật ${clock()}`;
          loading = false;
          refreshSync();
          renderProgress();
          if (!$("viewScan").hidden && $("boxInput").value.trim()) search(false);
        })
        .catch(() => { if (!outbox.length) setSync("err", "Mất kết nối · chạm để thử lại"); })
        .finally(() => { loading = false; });
    }

    function setSync(state, text) {
      $("sync").dataset.s = state;
      $("syncText").textContent = text;
    }

    function buildCache(rawItems) {
      BOX_MAP = {};
      for (const item of rawItems) {
        const id = item.boxId;
        if (!BOX_MAP[id]) {
          BOX_MAP[id] = { boxId: id, inboundNo: item.inboundNo, bin: item.bin, operator: item.operator, updatedTime: item.updatedTime, totalQty: 0, skuCount: 0, items: [] };
        }
        BOX_MAP[id].totalQty += item.qty;
        BOX_MAP[id].skuCount += 1;
        BOX_MAP[id].items.push(item);
      }
      BOX_LIST = Object.values(BOX_MAP);
    }

    function renderProgress() {
      const total = BOX_LIST.length;
      const done = BOX_LIST.filter((b) => b.bin).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      $("progBar").style.width = pct + "%";
      $("progText").innerHTML = total ? `<b>${done}</b> / ${total} thùng đã lên kệ` : "Chưa có dữ liệu";
      $("progPct").textContent = total ? pct + "%" : "";
    }

    // ---------- BƯỚC 1: TÌM THÙNG ----------
    // fromEnter = true khi bấm Enter / súng quét gửi Enter
    function search(fromEnter) {
      const kw = $("boxInput").value.trim().toUpperCase();
      const hint = $("scanHint");
      $("clearBtn").hidden = !kw;

      if (!kw) {
        hint.hidden = true;
        $("results").innerHTML = "";
        renderRecent();
        return;
      }
      $("recentWrap").hidden = true;

      if (!BOX_LIST.length) {
        $("results").innerHTML = "";
        showHint(loading ? "Đang tải dữ liệu, chờ một chút…" : "Chưa có dữ liệu kho. Chạm vào dòng trạng thái ở trên để tải lại.", false, false);
        return;
      }

      const matches = BOX_LIST.filter((b) => b.boxId.indexOf(kw) !== -1);
      if (!matches.length) {
        $("results").innerHTML = "";
        showHint(`Không có thùng nào khớp “${kw}”. Hàng chưa được nhập dữ liệu, không lên kệ!`, true, fromEnter);
        return;
      }
      hint.hidden = true;

      const exact = BOX_MAP[kw];
      if (exact && (fromEnter || matches.length === 1)) return selectBox(kw);
      // Gõ đuôi mã (VD "A10") + Enter: chọn luôn nếu chỉ một thùng có đuôi đó
      const best = bestMatch(matches, kw);
      if (fromEnter && best) return selectBox(best.boxId);
      renderResults(matches, kw, best);
    }

    function bestMatch(matches, kw) {
      if (matches.length === 1) return matches[0];
      const tail = matches.filter((b) => b.boxId.endsWith(kw));
      return tail.length === 1 ? tail[0] : null;
    }

    function showHint(msg, isErr, shake) {
      const hint = $("scanHint");
      hint.textContent = msg;
      hint.className = "hint" + (isErr ? " err" : "");
      hint.hidden = false;
      if (shake) {
        void hint.offsetWidth;
        hint.classList.add("shake");
        vibrate([40, 40, 40]);
        $("boxInput").select();
      }
    }

    function highlight(id, kw) {
      const i = id.indexOf(kw);
      if (i < 0) return esc(id);
      return esc(id.slice(0, i)) + "<mark>" + esc(kw) + "</mark>" + esc(id.slice(i + kw.length));
    }

    function renderResults(list, kw, best) {
      const MAX = 40;
      // Thùng chọn bằng Enter lên đầu, rồi khớp đuôi mã, rồi thùng chưa lên kệ
      const sorted = list.slice().sort((a, b) =>
        (b === best) - (a === best) || (b.boxId.endsWith(kw) - a.boxId.endsWith(kw)) ||
        (!!a.bin - !!b.bin) || a.boxId.localeCompare(b.boxId));
      let html = sorted.slice(0, MAX).map((b) => `
        <button class="row${b === best ? " row-best" : ""}" data-id="${esc(b.boxId)}">
          <span class="row-main">
            <span class="row-id">${highlight(b.boxId, kw)}</span>
            <span class="row-meta">${esc(b.inboundNo)} · ${b.totalQty} hộp · ${b.skuCount} mã${b === best ? `<span class="enter-tag">Enter ↵</span>` : ""}</span>
          </span>
          ${b.bin ? `<span class="pill pill-done">${esc(b.bin)}</span>` : `<span class="pill pill-empty">Chưa lên kệ</span>`}
        </button>`).join("");
      if (sorted.length > MAX) html += `<div class="more">…và ${sorted.length - MAX} thùng nữa, gõ thêm ký tự để lọc</div>`;
      const box = $("results");
      box.innerHTML = html;
      box.querySelectorAll(".row").forEach((el) => { el.onclick = () => selectBox(el.dataset.id); });
    }

    function renderRecent() {
      const wrap = $("recentWrap");
      wrap.hidden = !recent.length || !!$("boxInput").value.trim();
      const icons = { pending: "⏳", saved: "✓", conflict: "!", failed: "✕" };
      const titles = { pending: "Đang lưu lên Sheet", saved: "Đã lưu lên Sheet", conflict: "Người khác đã lên kệ thùng này", failed: "Không lưu được" };
      $("recentList").innerHTML = recent.map((r) => `
        <button class="recent-row${r.status === "conflict" || r.status === "failed" ? " bad" : ""}" data-id="${esc(r.boxId)}">
          <span class="id">${esc(r.boxId)}</span><span class="bin">${esc(r.bin)}</span>
          <span class="st st-${r.status}" title="${titles[r.status] || ""}">${icons[r.status] || ""}</span><span class="t">${esc(r.time)}</span>
        </button>`).join("");
      $("recentList").querySelectorAll(".recent-row").forEach((el) => { el.onclick = () => selectBox(el.dataset.id); });
    }

    // ---------- BƯỚC 2: THÙNG + KỆ ----------
    function selectBox(id) {
      const b = BOX_MAP[id];
      if (!b) return;
      selectedId = id;
      digits = "";
      scanPrefix = "";
      $("boxInput").blur();

      $("bxId").textContent = b.boxId;
      $("bxInbound").textContent = b.inboundNo || "—";
      $("bxQty").textContent = `${b.totalQty} hộp`;
      $("bxSkuCount").textContent = b.skuCount;
      $("bxSkus").innerHTML = b.items.map((it) => `<div class="sku"><span>${esc(it.sku)}</span><b>${it.qty} hộp</b></div>`).join("");
      $("skuDetails").open = false;

      const st = $("bxState");
      if (b.bin) {
        const otherFloor = !b.bin.toUpperCase().startsWith(prefix());
        const pending = outbox.some((o) => o.boxId === id);
        st.className = "state state-done";
        st.innerHTML = `
          <div class="state-label">Đã lên kệ${pending ? " · đang lưu lên Sheet ⏳" : ""}</div>
          <div class="state-bin">${esc(b.bin)}</div>
          <div class="state-meta">bởi ${esc(b.operator || "?")}${b.updatedTime ? " · " + esc(b.updatedTime) : ""} — kiểm tra kỹ đơn nhập để tránh nhầm ngày</div>
          ${otherFloor ? `<div class="state-note">Kệ này không thuộc tầng bạn đang chọn (${prefix()}).</div>` : ""}`;
        $("binPanel").hidden = true;
        $("btnMove").hidden = false;
        $("binLabel").textContent = "Vị trí kệ MỚI";
      } else {
        st.className = "state state-empty";
        st.innerHTML = `<div class="state-label">Chưa lên kệ</div>`;
        $("binPanel").hidden = false;
        $("btnMove").hidden = true;
        $("binLabel").textContent = "Bước 2 · Vị trí kệ";
      }

      renderDigits();
      $("viewScan").hidden = true;
      $("viewBox").hidden = false;
      window.scrollTo(0, 0);
    }

    // Thùng đã lên kệ: phải bấm rõ ràng mới hiện bàn phím nhập kệ mới
    function startMove() {
      $("btnMove").hidden = true;
      $("binPanel").hidden = false;
      $("binPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function backToScan(focus = true) {
      selectedId = "";
      digits = "";
      scanPrefix = "";
      $("boxInput").value = "";
      $("viewBox").hidden = true;
      $("viewScan").hidden = false;
      search(false);
      if (focus) $("boxInput").focus();
    }

    function buildKeypad() {
      const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "clear", "0", "back"];
      const labels = { clear: "Xoá hết", back: "⌫" };
      const pad = $("keypad");
      pad.innerHTML = keys.map((k) => `<button class="key${labels[k] ? " fn" : ""}" data-k="${k}">${labels[k] || k}</button>`).join("");
      pad.querySelectorAll(".key").forEach((el) => { el.onclick = () => pressKey(el.dataset.k); });
    }

    function pressKey(k) {
      if (k === "back") digits = digits.slice(0, -1);
      else if (k === "clear") digits = "";
      else if (digits.length < 6) digits += k;
      vibrate(8);
      renderDigits();
    }

    function renderDigits() {
      let html = `<span class="slot-pre">${prefix()}</span>`;
      for (let i = 0; i < 6; i++) {
        const cls = ["slot"];
        if (i === 2 || i === 4) cls.push("gap");
        if (i < digits.length) cls.push("filled");
        if (i === digits.length) cls.push("current");
        html += `<span class="${cls.join(" ")}">${digits[i] || ""}</span>`;
      }
      $("slots").innerHTML = html;
      const btn = $("btnSave");
      btn.disabled = digits.length !== 6;
      btn.textContent = digits.length === 6 ? `Lên kệ ${prefix()}${digits}` : `Nhập đủ 6 số (${digits.length}/6)`;
    }

    function anyOverlayOpen() {
      return !$("dlg").hidden || !$("menu").hidden || !$("setup").hidden || !$("flash").hidden;
    }

    // Bàn phím vật lý / súng quét khi đang ở bước nhập kệ
    function onGlobalKey(e) {
      if (!$("flash").hidden) hideFlash();
      if (anyOverlayOpen() || $("viewBox").hidden || $("binPanel").hidden) return;
      if (e.target && e.target.tagName === "INPUT") return;
      const k = e.key;
      if (k === "s" || k === "S") {
        // Quét mã kệ đầy đủ "S15xxxxxx": bỏ tiền tố, kiểm tra đúng tầng
        scanPrefix = "S";
        digits = "";
        renderDigits();
      } else if (/^[0-9]$/.test(k)) {
        e.preventDefault();
        if (scanPrefix) {
          scanPrefix += k;
          if (scanPrefix.length === 3) {
            const p = scanPrefix;
            scanPrefix = "";
            if (p !== prefix()) {
              digits = "";
              renderDigits();
              alertDlg("Sai tầng", `Mã kệ ${p}… thuộc tầng khác.\nBạn đang chọn ${prefix()} (Tầng ${floor}).`, "🏢");
            }
          }
          return;
        }
        pressKey(k);
      } else if (k === "Backspace") {
        e.preventDefault();
        pressKey("back");
      } else if (k === "Enter") {
        e.preventDefault();
        if (digits.length === 6) save(false);
      } else if (k === "Escape") {
        backToScan();
      }
    }

    // Bấm lưu là xong ngay trên máy; việc ghi lên Sheet chạy ngầm qua hàng chờ
    function save() {
      if (!operator || !floor) { openSetup(); return; }
      if (!selectedId || digits.length !== 6) return;

      const target = selectedId;
      const bin = prefix() + digits;
      const b = BOX_MAP[target];
      const item = {
        boxId: target, bin: bin, operator: operator,
        // Thùng đã có kệ thì người dùng đã bấm "Chuyển sang kệ khác", cho ghi đè luôn
        force: !!(b && b.bin),
        prevBin: b ? b.bin : "", prevOperator: b ? b.operator : "", prevTime: b ? b.updatedTime : "",
        at: Date.now()
      };
      if (b) { b.bin = bin; b.operator = operator; b.updatedTime = ""; }
      addRecent(target, bin);
      renderProgress();
      // Focus ô tìm ngay để quét thùng kế tiếp
      backToScan(true);
      showFlash(target, bin);
      enqueueSave(item);
    }

    function addRecent(boxId, bin) {
      recent.unshift({ boxId: boxId, bin: bin, time: clock(), status: "pending" });
      if (recent.length > 8) recent.length = 8;
      renderRecent();
    }

    function setRecentStatus(item, status) {
      const r = recent.find((x) => x.boxId === item.boxId && x.bin === item.bin && x.status === "pending");
      if (r) r.status = status;
      renderRecent();
    }

    // ---------- LƯU NGẦM: HÀNG CHỜ GỬI LÊN SHEET ----------
    // Hàng chờ giữ trong máy nên tắt app hay mất mạng giữa chừng cũng không mất; có mạng là tự gửi tiếp.
    const OUTBOX_KEY = "WAREHOUSE_OUTBOX";
    let outbox = [];
    try {
      outbox = JSON.parse(store.get(OUTBOX_KEY) || "[]");
      if (!Array.isArray(outbox)) outbox = [];
    } catch (e) { outbox = []; }
    let flushing = false;
    let retryTimer = null;
    let retryDelay = 2000;
    let flushError = "";
    let batchSupported = true;

    function persistOutbox() {
      store.set(OUTBOX_KEY, JSON.stringify(outbox));
    }

    function enqueueSave(item) {
      // Cùng một thùng lưu lại khi lần trước chưa gửi: chỉ giữ lần mới nhất
      outbox = outbox.filter((o) => o.boxId !== item.boxId);
      outbox.push(item);
      persistOutbox();
      refreshSync();
      flushNow();
    }

    // Áp các thùng đang chờ lưu lên dữ liệu vừa tải về, để không bị "mất" trên màn hình
    function applyOutbox() {
      outbox.forEach((o) => {
        const b = BOX_MAP[o.boxId];
        if (b) { b.bin = o.bin; b.operator = o.operator; b.updatedTime = ""; }
      });
    }

    function flushNow() {
      clearTimeout(retryTimer);
      retryTimer = null;
      retryDelay = 2000;
      flush();
    }

    async function flush() {
      if (flushing || !outbox.length) return;
      flushing = true;
      const batch = outbox.slice(0, 25);
      let ok = false;
      try {
        const results = await sendBatch(batch);
        const problems = [];
        batch.forEach((item, i) => {
          const hasNewer = outbox.some((o) => o.boxId === item.boxId && batch.indexOf(o) === -1);
          const p = handleResult(item, results[i] || { success: false, message: "Không có phản hồi" }, hasNewer);
          if (p) problems.push(p);
        });
        outbox = outbox.filter((o) => batch.indexOf(o) === -1);
        persistOutbox();
        flushError = "";
        retryDelay = 2000;
        ok = true;
        if (!outbox.length) lastSyncText = `Đã lưu lên Sheet · ${clock()}`;
        if (problems.length) reportProblems(problems);
      } catch (err) {
        // Mất mạng / server bận: giữ nguyên hàng chờ, thử lại sau 2s, 4s, 8s… tối đa 30s
        flushError = err.message || "Mất kết nối";
        retryTimer = setTimeout(() => { retryTimer = null; flush(); }, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 30000);
      } finally {
        flushing = false;
        refreshSync();
        if (ok && outbox.length) flush();
      }
    }

    async function sendBatch(batch) {
      const items = batch.map((o) => ({ boxId: o.boxId, bin: o.bin, operator: o.operator, forceOverwrite: o.force }));
      if (batchSupported) {
        const res = await callApi("updateBatch", { items: items });
        if (res.success && Array.isArray(res.results)) return res.results;
        // Apps Script bản cũ chưa có updateBatch: lưu từng thùng
        if (/Action không hợp lệ/.test(res.message || "")) batchSupported = false;
        else throw new Error(res.message || "Lỗi lưu");
      }
      const results = [];
      for (const it of items) results.push(await callApi("updateLocation", it));
      return results;
    }

    // Trả về mô tả lỗi nếu thùng này không lưu được, null nếu ổn
    function handleResult(item, r, hasNewer) {
      const b = BOX_MAP[item.boxId];
      // Gửi lại sau khi mất mạng: server báo trùng chính vị trí mình đã lưu thì coi như xong
      const sameBin = r.isAlreadySaved && String(r.existingBin || "").toUpperCase() === item.bin;
      if (r.success || sameBin) {
        if (b && !hasNewer && r.nowStr) b.updatedTime = r.nowStr;
        setRecentStatus(item, "saved");
        return null;
      }
      if (b && !hasNewer) {
        if (r.isAlreadySaved) { b.bin = r.existingBin; b.operator = r.existingUser; b.updatedTime = ""; }
        else { b.bin = item.prevBin; b.operator = item.prevOperator; b.updatedTime = item.prevTime; }
      }
      renderProgress();
      if (selectedId === item.boxId) selectBox(item.boxId);
      setRecentStatus(item, r.isAlreadySaved ? "conflict" : "failed");
      return { item: item, r: r };
    }

    function reportProblems(problems) {
      if (problems.length === 1 && problems[0].r.isAlreadySaved) {
        const { item, r } = problems[0];
        confirmDlg(
          "Người khác đã lên kệ thùng này",
          `${item.boxId} vừa được ${r.existingUser || "?"} lên kệ ${r.existingBin}.\nBạn đã lưu ${item.bin}.\n\nĐổi sang ${item.bin}?`,
          "⚠️", "Đổi kệ",
          () => resave(item)
        );
        return;
      }
      const lines = problems.map(({ item, r }) =>
        r.isAlreadySaved ? `${item.boxId}: đã ở kệ ${r.existingBin} (${r.existingUser || "?"})` : `${item.boxId}: ${r.message || "lỗi"}`);
      alertDlg("Có thùng chưa lưu được", lines.join("\n") + "\n\nMở lại từng thùng để kiểm tra.", "❌");
    }

    function resave(item) {
      const b = BOX_MAP[item.boxId];
      const prev = b ? { bin: b.bin, op: b.operator, t: b.updatedTime } : { bin: "", op: "", t: "" };
      if (b) { b.bin = item.bin; b.operator = item.operator; b.updatedTime = ""; }
      addRecent(item.boxId, item.bin);
      renderProgress();
      enqueueSave(Object.assign({}, item, { force: true, prevBin: prev.bin, prevOperator: prev.op, prevTime: prev.t, at: Date.now() }));
    }

    function refreshSync() {
      const n = outbox.length;
      if (n && flushError) setSync("err", `Mất mạng · ${n} thùng chờ lưu · chạm để gửi lại`);
      else if (n) setSync("loading", `Đang lưu ${n} thùng lên Sheet…`);
      else if (!loading && lastSyncText) setSync("ok", lastSyncText);
    }

    function syncTap() {
      if (outbox.length) flushNow();
      loadData(true);
    }

    let flashTimer = null;
    function showFlash(boxId, bin) {
      $("flashBox").textContent = boxId;
      $("flashBin").textContent = bin;
      $("flash").hidden = false;
      vibrate(80);
      clearTimeout(flashTimer);
      flashTimer = setTimeout(hideFlash, 700);
    }
    function hideFlash() {
      clearTimeout(flashTimer);
      if ($("flash").hidden) return;
      $("flash").hidden = true;
      if (!$("viewScan").hidden) $("boxInput").focus();
    }

    // ---------- THIẾT LẬP: TÊN + TẦNG ----------
    let setupFloor = null;
    function openSetup() {
      closeMenu();
      setupFloor = floor;
      $("setupName").value = operator;
      $("setupCancel").hidden = !(operator && floor);
      renderSetup();
      $("setup").hidden = false;
      setTimeout(() => { if (!operator) $("setupName").focus(); }, 100);
    }
    function pickFloor(f) {
      setupFloor = f;
      renderSetup();
    }
    function renderSetup() {
      document.querySelectorAll(".floor-card").forEach((c) => c.classList.toggle("on", Number(c.dataset.f) === setupFloor));
      setFloorTheme(setupFloor || floor || 1);
      $("setupGo").disabled = !($("setupName").value.trim() && setupFloor);
    }
    function saveSetup() {
      const name = $("setupName").value.trim().toUpperCase();
      if (!name || !setupFloor) return;
      operator = name;
      floor = setupFloor;
      store.set("WAREHOUSE_OPERATOR", operator);
      store.set("WAREHOUSE_FLOOR", String(floor));
      $("setup").hidden = true;
      applyFloor();
      renderOperator();
      if (selectedId) selectBox(selectedId);
      else $("boxInput").focus();
    }
    function closeSetup() {
      $("setup").hidden = true;
      applyFloor();
    }
    // Màu thanh trạng thái điện thoại cũng đổi theo tầng
    function setFloorTheme(f) {
      document.body.dataset.floor = f;
      $("themeColor").setAttribute("content", f === 2 ? "#7c3aed" : "#0b6bcb");
    }
    function applyFloor() {
      setFloorTheme(floor || 1);
      $("floorNum").textContent = floor ? "Tầng " + floor : "Tầng ?";
      $("floorPre").textContent = prefix();
      renderDigits();
    }
    function renderOperator() {
      $("hdrOp").textContent = operator || "Chưa nhập tên";
    }

    // ---------- MENU ----------
    function openMenu() {
      renderMenu();
      $("menu").hidden = false;
    }
    function closeMenu() {
      $("menu").hidden = true;
    }
    function renderMenu() {
      const items = [
        { t: "Ca làm việc" },
        { ic: "👤", b: "Đổi nhân viên / tầng", s: `${operator || "Chưa nhập"} · Tầng ${floor || "?"} (${prefix()})`, fn: openSetup },
        { ic: "🔄", b: "Tải lại dữ liệu", s: lastLoadAt ? `Lần cuối ${clock(lastLoadAt)}` : "Chưa tải", fn: () => { closeMenu(); loadData(); } },
        { t: "Quản trị" }
      ];
      if (adminPin) {
        items.push(
          { ic: "📥", b: "Nạp file Excel mới", s: "Thay toàn bộ dữ liệu trên Sheet", fn: () => { closeMenu(); $("fileInput").click(); } },
          { ic: "📤", b: "Xuất file đã xong", s: "Tải về file .xlsx", fn: () => { closeMenu(); exportCompletedFile(); } },
          { ic: "🔒", b: "Khoá quản trị", s: "", fn: () => { adminPin = ""; renderMenu(); } }
        );
      } else {
        items.push({ ic: "🔐", b: "Mở quản trị", s: "Cần mã PIN", fn: () => { closeMenu(); askPin(); } });
      }
      const body = $("menuBody");
      body.innerHTML = "";
      items.forEach((it) => {
        if (it.t) {
          const h = document.createElement("div");
          h.className = "sheet-title";
          h.textContent = it.t;
          body.appendChild(h);
          return;
        }
        const el = document.createElement("button");
        el.className = "menu-item";
        el.innerHTML = `<span class="ic">${it.ic}</span><span class="tx"><b>${esc(it.b)}</b>${it.s ? `<small>${esc(it.s)}</small>` : ""}</span>`;
        el.onclick = it.fn;
        body.appendChild(el);
      });
    }

    function askPin() {
      openDialog({
        icon: "🔐", title: "Mở quản trị", body: "Nhập mã PIN để nạp & xuất file",
        input: { type: "password", placeholder: "PIN" },
        actions: [
          { label: "Huỷ", kind: "ghost" },
          { label: "Mở khoá", kind: "primary", fn: (pin) => {
            pin = String(pin || "").trim();
            callApi("verifyPin", { pin: pin })
              .then((res) => {
                if (res.success) { adminPin = pin; openMenu(); }
                else alertDlg("Sai mã PIN", "Mã PIN không chính xác!", "❌");
              })
              .catch((err) => alertDlg("Mất kết nối", err.message, "📡"));
          } }
        ]
      });
    }

    // ---------- HỘP THOẠI ----------
    function openDialog(opt) {
      $("dlgIcon").textContent = opt.icon || "";
      $("dlgTitle").textContent = opt.title || "";
      $("dlgBody").innerHTML = esc(opt.body || "").replace(/\n/g, "<br>");
      const inp = $("dlgInput");
      inp.hidden = !opt.input;
      inp.value = "";
      if (opt.input) { inp.type = opt.input.type || "text"; inp.placeholder = opt.input.placeholder || ""; }
      const acts = $("dlgActions");
      acts.innerHTML = "";
      const run = (a) => { const v = inp.value; closeDialog(); if (a.fn) a.fn(v); };
      (opt.actions || []).forEach((a) => {
        const b = document.createElement("button");
        b.className = "btn btn-" + (a.kind || "ghost");
        b.textContent = a.label;
        b.onclick = () => run(a);
        acts.appendChild(b);
      });
      inp.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        const p = (opt.actions || []).find((a) => a.kind === "primary");
        if (p) run(p);
      };
      $("dlg").hidden = false;
      if (opt.input) setTimeout(() => inp.focus(), 80);
    }
    function closeDialog() {
      $("dlg").hidden = true;
    }
    function alertDlg(title, body, icon, onOk) {
      openDialog({ icon: icon || "ℹ️", title: title, body: body, actions: [{ label: "Đã hiểu", kind: "primary", fn: onOk }] });
    }
    function confirmDlg(title, body, icon, okLabel, onOk, onCancel) {
      openDialog({ icon: icon, title: title, body: body, actions: [
        { label: "Huỷ", kind: "ghost", fn: onCancel },
        { label: okLabel, kind: "danger", fn: onOk }
      ] });
    }

    // ---------- QUẢN TRỊ: NẠP / XUẤT FILE ----------
    function ensureExcelJS() {
      if (window.ExcelJS) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = EXCELJS_URL;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Không tải được thư viện đọc Excel"));
        document.head.appendChild(s);
      });
    }

    // Nạp file Excel lưu trọn vẹn màu sắc vào Sheet
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      confirmDlg(
        "Nạp file mới?",
        `"${file.name}"\nToàn bộ dữ liệu và màu sắc cũ trên Sheet sẽ bị thay thế.`,
        "📥", "Nạp file",
        function() {
          setSync("loading", "Đang đọc file Excel…");
          ensureExcelJS()
            .then(() => file.arrayBuffer())
            .then(async (buffer) => {
              const workbook = new ExcelJS.Workbook();
              await workbook.xlsx.load(buffer);

              const worksheet = workbook.worksheets[0];
              const totalRows = worksheet.rowCount;
              if (totalRows < 2) throw new Error("File Excel không có dữ liệu hàng!");

              const rows = [];
              const bgColors = [];
              const fontColors = [];

              for (let r = 2; r <= totalRows; r++) {
                const row = worksheet.getRow(r);
                const val1 = row.getCell(1).value !== null ? String(row.getCell(1).text || row.getCell(1).value).trim() : "";
                const val2 = row.getCell(2).value !== null ? String(row.getCell(2).text || row.getCell(2).value).trim() : "";
                const val3 = row.getCell(3).value !== null ? String(row.getCell(3).text || row.getCell(3).value).trim() : "";
                const val4 = row.getCell(4).value !== null ? (Number(row.getCell(4).value) || 0) : 0;
                const val5 = row.getCell(5).value !== null ? String(row.getCell(5).text || row.getCell(5).value).trim() : "";

                if (!val1 && !val2 && !val3) continue;

                rows.push([val1, val2, val3, val4, val5]);

                const rowBgs = [];
                const rowFonts = [];
                for (let c = 1; c <= 5; c++) {
                  const cell = row.getCell(c);

                  let bg = "#ffffff";
                  if (cell.fill) {
                    if (cell.fill.fgColor && cell.fill.fgColor.argb) {
                      const argb = String(cell.fill.fgColor.argb);
                      bg = (argb.length === 8) ? ("#" + argb.substring(2)) : ("#" + argb);
                    } else if (cell.fill.fgColor && cell.fill.fgColor.theme !== undefined) {
                      const t = cell.fill.fgColor.theme;
                      const tint = cell.fill.fgColor.tint || 0;
                      if (t === 0 || tint < 0) {
                        bg = "#000000";
                      } else if (t === 1 && tint === 0) {
                        bg = "#ffffff";
                      } else {
                        bg = "#333333";
                      }
                    }
                  }
                  rowBgs.push(bg);

                  let fontColor = "#000000";
                  if (cell.font && cell.font.color && cell.font.color.argb) {
                    const argb = String(cell.font.color.argb);
                    fontColor = (argb.length === 8) ? ("#" + argb.substring(2)) : ("#" + argb);
                  }
                  rowFonts.push(fontColor);
                }
                bgColors.push(rowBgs);
                fontColors.push(rowFonts);
              }

              setSync("loading", "Đang ghi lên Sheet…");
              return callApi("import", { pin: adminPin, payload: { values: rows, bgColors: bgColors, fontColors: fontColors } });
            })
            .then((res) => {
              if (res.success) {
                alertDlg("Đã nạp xong", `Đã nạp ${res.count} dòng dữ liệu, giữ nguyên định dạng và màu sắc.`, "🎉");
                loadData();
              } else {
                setSync("err", "Nạp file thất bại");
                alertDlg("Lỗi lưu dữ liệu", res.message, "❌");
              }
            })
            .catch((err) => {
              setSync("err", "Nạp file thất bại");
              alertDlg("Lỗi nạp file", err.message, "❌");
            });
        }
      );
    }

    function exportCompletedFile() {
      setSync("loading", "Đang tạo link tải…");
      callApi("exportUrl", { pin: adminPin })
        .then((res) => {
          setSync("ok", "Sẵn sàng");
          if (!res.success || !res.url) {
            alertDlg("Lỗi", res.message || "Không thể lấy link tải file!", "❌");
            return;
          }
          window.location.href = res.url;
        })
        .catch((err) => {
          setSync("err", "Xuất file thất bại");
          alertDlg("Lỗi xuất file", err.message, "❌");
        });
    }
  </script>
</body>
</html>
